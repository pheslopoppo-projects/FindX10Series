<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="50%" stop-color="#151517"/>
      <stop offset="100%" stop-color="#0D0D0E"/>
    </linearGradient>
    <linearGradient id="copperRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98E4B"/>
      <stop offset="50%" stop-color="#B87333"/>
      <stop offset="100%" stop-color="#6E4017"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3A4050"/>
      <stop offset="60%" stop-color="#12151D"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Device Outline -->
  <rect x="75" y="40" width="450" height="820" rx="55" fill="url(#bodyGrad)" stroke="#38383D" stroke-width="4"/>
  <rect x="79" y="44" width="442" height="812" rx="51" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Camera Module Outer Ring with Copper Accent -->
  <circle cx="300" cy="290" r="175" fill="#18181A" stroke="url(#copperRim)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="300" cy="290" r="162" fill="#121214" stroke="#2A2A2E" stroke-width="2"/>

  <!-- Periscope Telephoto 200MP Lens (Top/Center) -->
  <rect x="250" y="170" width="100" height="70" rx="14" fill="#0C0D10" stroke="#B87333" stroke-width="2"/>
  <circle cx="300" cy="205" r="28" fill="url(#lensGlass)" stroke="#222530" stroke-width="3"/>
  <circle cx="306" cy="200" r="7" fill="#506690" opacity="0.6"/>
  <text x="300" y="235" text-anchor="middle" fill="#D98E4B" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" letter-spacing="1">200MP PERISCOPE</text>

  <!-- Main Wide 200MP Sensor (Bottom Left) -->
  <circle cx="230" cy="330" r="48" fill="#0E0F12" stroke="url(#copperRim)" stroke-width="3"/>
  <circle cx="230" cy="330" r="38" fill="url(#lensGlass)"/>
  <circle cx="236" cy="324" r="11" fill="#4B6A9B" opacity="0.7"/>
  <text x="230" y="375" text-anchor="middle" fill="#D98E4B" font-family="-apple-system, sans-serif" font-weight="800" font-size="8" letter-spacing="1">200MP WIDE</text>

  <!-- Ultra-Wide 200MP Sensor (Bottom Right) -->
  <circle cx="370" cy="330" r="48" fill="#0E0F12" stroke="url(#copperRim)" stroke-width="3"/>
  <circle cx="370" cy="330" r="38" fill="url(#lensGlass)"/>
  <circle cx="376" cy="324" r="9" fill="#3D5A7A" opacity="0.6"/>
  <text x="370" y="375" text-anchor="middle" fill="#D98E4B" font-family="-apple-system, sans-serif" font-weight="800" font-size="8" letter-spacing="1">200MP ULTRA-WIDE</text>

  <!-- Hasselblad Branding -->
  <circle cx="300" cy="280" r="8" fill="#B87333" opacity="0.8"/>
  <text x="300" y="410" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="4">HASSELBLAD</text>
  <text x="300" y="430" text-anchor="middle" fill="#B87333" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="2">WORLD'S FIRST TRIPLE 200MP</text>

  <!-- Technical Specs Badges -->
  <g transform="translate(110, 500)">
    <rect width="380" height="70" rx="14" fill="#1C1C1F" stroke="#2C2C30" stroke-width="1.5"/>
    <circle cx="36" cy="35" r="18" fill="rgba(184, 115, 51, 0.2)"/>
    <text x="36" y="40" text-anchor="middle" fill="#B87333" font-size="13" font-weight="bold">3x</text>
    <text x="70" y="32" fill="#E0E0E0" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">Triple 200MP Imaging System</text>
    <text x="70" y="52" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="12">World-first: All three rear lenses are 200MP</text>
  </g>

  <g transform="translate(110, 585)">
    <rect width="380" height="70" rx="14" fill="#1C1C1F" stroke="#2C2C30" stroke-width="1.5"/>
    <circle cx="36" cy="35" r="18" fill="rgba(184, 115, 51, 0.2)"/>
    <text x="36" y="41" text-anchor="middle" fill="#B87333" font-size="13" font-weight="bold">OIS</text>
    <text x="70" y="32" fill="#E0E0E0" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">200MP Periscope Telephoto</text>
    <text x="70" y="52" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="12">High-res optical zoom up to 120X with Prism OIS</text>
  </g>

  <g transform="translate(110, 670)">
    <rect width="380" height="70" rx="14" fill="#1C1C1F" stroke="#2C2C30" stroke-width="1.5"/>
    <circle cx="36" cy="35" r="18" fill="rgba(184, 115, 51, 0.2)"/>
    <text x="36" y="41" text-anchor="middle" fill="#B87333" font-size="12" font-weight="bold">H</text>
    <text x="70" y="32" fill="#E0E0E0" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">Co-Developed with Hasselblad</text>
    <text x="70" y="52" fill="#8E8E93" font-family="-apple-system, sans-serif" font-size="12">Iconic portrait bokeh &amp; 16-bit computational RAW</text>
  </g>
</svg>
