<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="100%" stop-color="#101115"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98E4B"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
  </defs>

  <!-- Device Frame -->
  <rect x="75" y="40" width="450" height="820" rx="55" fill="#0C0D0F" stroke="#333338" stroke-width="4"/>
  <rect x="90" y="55" width="420" height="790" rx="42" fill="url(#screenGrad)"/>

  <!-- Front Camera Punch Hole -->
  <circle cx="300" cy="80" r="9" fill="#050507" stroke="#222" stroke-width="2"/>

  <!-- Fluid Cloud Dynamic Island Capsule -->
  <g transform="translate(150, 115)">
    <rect width="300" height="52" rx="26" fill="#1B1C22" stroke="#B87333" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="16" fill="rgba(184, 115, 51, 0.25)"/>
    <circle cx="28" cy="26" r="6" fill="#D98E4B"/>
    <text x="56" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13">ColorOS 17 Fluid Cloud</text>
    <text x="56" y="40" fill="#B87333" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">7,150 mAh • 80W SUPERVOOC</text>
    <text x="265" y="32" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14">92%</text>
  </g>

  <!-- Dimensity 9600 Pro Processor Card -->
  <g transform="translate(120, 200)">
    <rect width="360" height="150" rx="22" fill="#1F2027" stroke="#333642" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="rgba(184, 115, 51, 0.2)"/>
    <text x="45" y="52" text-anchor="middle" fill="#B87333" font-size="18" font-weight="bold">9600</text>
    <text x="80" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="bold" font-size="17">Dimensity 9600 Pro</text>
    <text x="80" y="62" fill="#B87333" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">Flagship 2nm AI Processing Architecture</text>
    
    <text x="25" y="105" fill="#D0D0D5" font-family="-apple-system, sans-serif" font-size="13">• World-class gaming frame rates &amp; power efficiency</text>
    <text x="25" y="130" fill="#D0D0D5" font-family="-apple-system, sans-serif" font-size="13">• Dedicated NPU for generative AI &amp; live translation</text>
  </g>

  <!-- ColorOS 17 Out-of-the-Box Feature Card -->
  <g transform="translate(120, 375)">
    <rect width="360" height="135" rx="22" fill="#1F2027" stroke="#333642" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="rgba(224, 224, 224, 0.15)"/>
    <text x="45" y="52" text-anchor="middle" fill="#E0E0E0" font-size="18">17</text>
    <text x="80" y="42" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="bold" font-size="17">ColorOS 17 (Out of the Box)</text>
    <text x="80" y="62" fill="#A8A8B0" font-family="-apple-system, sans-serif" font-size="12">Smoother parallel animations &amp; smarter widgets</text>
    
    <text x="25" y="105" fill="#D0D0D5" font-family="-apple-system, sans-serif" font-size="13">• Instant cross-device transfer and unified clipboard</text>
  </g>

  <!-- Battery & Fast Charge Summary Badge -->
  <g transform="translate(120, 535)">
    <rect width="360" height="120" rx="22" fill="rgba(184, 115, 51, 0.12)" stroke="#B87333" stroke-width="2"/>
    <text x="180" y="45" text-anchor="middle" fill="#D98E4B" font-family="-apple-system, sans-serif" font-weight="800" font-size="16">Unmatched Power Combo</text>
    <text x="180" y="75" text-anchor="middle" fill="#E0E0E0" font-family="-apple-system, sans-serif" font-size="14">Colossal 7,150mAh battery + 80W SUPERVOOC</text>
    <text x="180" y="98" text-anchor="middle" fill="#A0A0A5" font-family="-apple-system, sans-serif" font-size="13">6-Year durability: &gt;80% capacity with 6-year endurance</text>
  </g>
</svg>
